name: Publish approved website to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      base_path:
        description: "Optional base override: / for a custom domain, otherwise leave blank"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Choose the website base
        env:
          REQUESTED_BASE: ${{ inputs.base_path }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%/*}"
          if [ -n "$REQUESTED_BASE" ]; then
            base="$REQUESTED_BASE"
          elif [ "$repo" = "$owner.github.io" ]; then
            base="/"
          else
            base="/$repo/"
          fi
          echo "WEBSITE_BASE_PATH=$base" >> "$GITHUB_ENV"
      - run: pnpm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4